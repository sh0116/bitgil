name = eyemate
summary = "EyeMate (눈동무) — LLM real-time screen narration"
description = """Uses vision LLMs to narrate the screen in real time for blind and
low-vision users, focused on gaming and learning. Complements NVDA by covering the
visual blind spots that screen readers cannot reach (games, charts, diagrams,
inaccessible apps)."""
author = "EyeMate contributors"
url = https://github.com/eyemate/eyemate
version = 0.0.1
docFileName = readme.html

; NVDA compatibility — target current stable API; update as tested.
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2024.4.0
