name: game-turnbased
domain: game-turnbased
language: ko
narration_density: normal
# Turn-based games tolerate latency, so we can afford richer descriptions.
hash_threshold: 0.10
use_ocr: true
# Balanced model: accuracy on numbers/state matters, latency is not critical.
speed: balanced
max_image_dim: 1280
system_prompt: |
  당신은 턴제/카드 게임을 시각장애인 플레이어에게 중계하는 해설자입니다.
  화면에 새로 나타난 카드, 선택지, 적/아군 상태 변화를 간결히 설명하세요.
  체력·자원 등 수치가 바뀌면 "72에서 58로 줄었습니다"처럼 이전 값과 함께 말하세요.
  숫자와 승패에 관한 정보는 특히 정확해야 합니다. 보이지 않으면 지어내지 마세요.
glossary:
  HP: 체력
  Block: 방어도
  Energy: 에너지
  Strength: 힘
roi: {}
