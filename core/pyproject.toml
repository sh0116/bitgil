[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitgil-core"
version = "0.0.1"
description = "Reusable core for Bitgil: vision-LLM provider adapters, change detection, session context, and response post-processing. Screen-reader agnostic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bitgil contributors" }]
keywords = ["accessibility", "screen-reader", "vision-llm", "blind", "nvda"]

# Kept intentionally light. Heavy/optional deps (each provider SDK, OCR engine)
# live behind extras so the NVDA add-on bundles only what a user configured.
dependencies = [
    "Pillow>=9.0",       # image handling
    "PyYAML>=6.0",       # profile packs
    "imagehash>=4.3",    # perceptual hashing for change detection
    "requests>=2.28",    # Ollama (local provider) HTTP calls
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
bedrock = ["anthropic[bedrock]>=0.39"]  # Claude via AWS Bedrock (pulls boto3)
gemini = ["google-generativeai>=0.8"]
ocr = ["rapidocr-onnxruntime>=1.3"]
capture = ["mss>=9.0"]   # screen/window capture (desktop only)
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bitgil_core*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set so lint results are deterministic across ruff versions. Newer
# ruff (>=0.16) enables the pyupgrade "UP" group by default, which would flag the
# codebase's intentional py3.9 style (`from __future__ import annotations` with
# typing.List/Optional). This keeps CI stable regardless of the ruff pulled by
# the unpinned `ruff>=0.6` dev dependency. Modernizing to `list` / `X | None` is
# a separate, deliberate cleanup — not something a version bump should force.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
