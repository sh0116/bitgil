name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core (dev)
        run: pip install -e ./core[dev]
      - name: Ruff lint
        run: ruff check core/
      - name: Run tests
        run: pytest -q

  addon-windows:
    name: Add-on smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches NVDA's bundled Python
      - name: Install core (dev)
        run: pip install -e ./core[dev]
      # The add-on layer is tested via the NVDA-stub harness (tests/test_addon.py),
      # which runs anywhere. Running it on Windows too guards Windows-Python quirks.
      - name: Run tests
        run: pytest -q
      - name: Build .nvda-addon
        run: python scripts/build_addon.py
      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitgil-nvda-addon
          path: dist/*.nvda-addon

  license-check:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Fail the build if any runtime dependency of bitgil-core carries a
      # license incompatible with our MIT/GPLv2 dual structure. This is the
      # automated backing for the competition's license-verification report.
      - name: Install core + pip-licenses
        run: |
          pip install -e ./core
          pip install pip-licenses
      - name: Check dependency licenses
        run: |
          pip-licenses --format=markdown --with-urls
          pip-licenses --fail-on="GPL-3.0;AGPL-3.0;GPL-3.0-only;GPL-3.0-or-later"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # BYO API Key means a leaked key is the top risk — scan every push/PR.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
